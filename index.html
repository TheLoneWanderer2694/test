<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roku Remote & Diagnostics Workstation</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            roku: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#6d28d9',
              700: '#5b21b6',
              800: '#4c1d95',
              900: '#2e1065',
              950: '#0f051d'
            }
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    
    .btn-active:active {
      transform: scale(0.95);
      filter: brightness(1.2);
    }
    .remote-glow {
      box-shadow: 0 0 30px -5px rgba(109, 40, 217, 0.3);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-roku-600 selection:text-white pb-12">

  <!-- Hidden Iframe Target for Silent ECP Form Submissions (Bypasses CORS/Fetch Blocks) -->
  <iframe name="ecp_target" id="ecp_target" class="hidden" style="display:none; width:0; height:0;"></iframe>

  <!-- Hidden Dynamic Form for Fast Network Dispatching -->
  <form id="ecpForm" method="POST" target="ecp_target" class="hidden"></form>

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- Top Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-6 border-b border-slate-800 gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-roku-700 to-indigo-500 flex items-center justify-center shadow-lg shadow-roku-900/50">
          <i data-lucide="tv" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            Roku Remote Workstation
            <span class="text-xs bg-roku-900/80 text-roku-300 border border-roku-700/50 px-2 py-0.5 rounded-full font-mono">v3.0 Ultra</span>
          </h1>
          <p class="text-xs text-slate-400">Direct Network ECP Remote & Diagnostics Utility</p>
        </div>
      </div>

      <!-- Quick IP Connection Bar -->
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 p-1.5 rounded-xl shadow-inner">
        <div class="relative flex-1 sm:w-64">
          <i data-lucide="wifi" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="targetIpInput" placeholder="Roku IP (e.g. 192.168.10.108)" 
                 class="w-full bg-slate-950 text-xs text-slate-100 pl-9 pr-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-roku-500 font-mono">
        </div>
        <button id="btnConnect" onclick="connectDevice()" class="px-3 py-2 bg-roku-600 hover:bg-roku-500 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 transition btn-active shadow-md">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="syncIcon"></i> Sync Device
        </button>
        <button onclick="toggleDeviceManager()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium flex items-center gap-1.5 transition border border-slate-700">
          <i data-lucide="server" class="w-3.5 h-3.5"></i> Devices
        </button>
      </div>
    </header>

    <!-- Main Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <!-- LEFT COLUMN: Remote Control (4 Cols) -->
      <div class="lg:col-span-5 flex flex-col items-center">
        <div class="w-full max-w-xs bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl remote-glow relative">
          
          <!-- Connection Status Indicator -->
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/80">
            <div class="flex items-center gap-2">
              <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              <span id="statusText" class="text-xs font-mono text-emerald-400">Ready</span>
            </div>
            <button onclick="sendKey('Power')" title="Power Toggle" class="w-9 h-9 rounded-full bg-red-950/60 hover:bg-red-900 border border-red-800/60 text-red-400 hover:text-red-200 flex items-center justify-center transition btn-active shadow-sm">
              <i data-lucide="power" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Quick System Nav Controls (Back, Home) -->
          <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="sendKey('Back')" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 rounded-xl flex items-center justify-center gap-2 text-xs font-medium transition btn-active">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </button>
            <button onclick="sendKey('Home')" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 rounded-xl flex items-center justify-center gap-2 text-xs font-medium transition btn-active">
              <i data-lucide="home" class="w-4 h-4"></i> Home
            </button>
          </div>

          <!-- D-PAD Cluster -->
          <div class="relative w-56 h-56 mx-auto my-4 bg-slate-950 rounded-full border border-slate-800 shadow-inner flex items-center justify-center p-3">
            <button onclick="sendKey('Up')" class="absolute top-2 w-14 h-12 bg-slate-800 hover:bg-roku-700 text-slate-200 rounded-t-2xl flex items-center justify-center transition btn-active">
              <i data-lucide="chevron-up" class="w-6 h-6"></i>
            </button>
            <button onclick="sendKey('Down')" class="absolute bottom-2 w-14 h-12 bg-slate-800 hover:bg-roku-700 text-slate-200 rounded-b-
